[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "system-design-on-the-go"
version = "0.1.0"
description = "Source-grounded system design discussions, two-voice audio, and a static podcast website"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.70",
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sd-podcast = "podcast_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["podcast_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Produce approved episode

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged episode draft PR number
        required: true
        type: string
      dry_run:
        description: Validate the production plan without TTS, upload, or commits
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  produce:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'episode/production-approved'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    environment: workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Dry-run plan
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          set -euo pipefail
          echo "Dry run: main is checked out and production prerequisites can be inspected."
          find episodes -mindepth 2 -maxdepth 2 -name episode.json -print | sort
          echo "Would render approved audio, upload it to R2, rebuild Pages/RSS, and commit metadata."
      - name: Render, upload, and publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ secrets.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ secrets.ELEVENLABS_VOICE_B }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          GOOGLE_CLOUD_AUDIO_API_KEY: ${{ secrets.GOOGLE_CLOUD_AUDIO_API_KEY }}
          GOOGLE_TTS_LANGUAGE_CODE: ${{ vars.GOOGLE_TTS_LANGUAGE_CODE }}
          GOOGLE_VOICE_A: ${{ vars.GOOGLE_VOICE_A }}
          GOOGLE_VOICE_B: ${{ vars.GOOGLE_VOICE_B }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          for required in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_PUBLIC_BASE_URL; do
            [[ -n "${!required:-}" ]] || { echo "Missing production setting: $required" >&2; exit 1; }
          done
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "Invalid PR number: $PR_NUMBER" >&2; exit 1; }
            merge_sha=$(gh pr view "$PR_NUMBER" --json mergeCommit -q .mergeCommit.oid)
          else
            merge_sha="$MERGE_SHA"
          fi
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid merge commit: $merge_sha" >&2; exit 1; }
          mapfile -t slugs < <(git diff --name-only "${merge_sha}^1" "$merge_sha" \
            | sed -n 's#^episodes/\([^/]*\)/episode\.json$#\1#p' | sort -u)
          test "${#slugs[@]}" -eq 1
          sd-podcast run --slug "${slugs[0]}" --approve
      - name: Commit publication metadata and site
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add episodes docs
          git diff --cached --quiet || git commit -m "Publish approved episode"
          gh auth setup-git
          git push

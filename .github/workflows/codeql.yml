name: CodeQL security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for CodeQL to access workflow metadata.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}
          upload: never # Code scanning is a paid feature on private repositories.
          output: sarif-results

      - name: Summarize findings
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(sarif-results/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No SARIF results were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '[.runs[].results[]] | "CodeQL findings: \(length)"' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/*.sarif
          if-no-files-found: warn
          retention-days: 14

name: Generate and publish a new podcast episode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Lowercase hyphenated episode slug
        required: true
        type: string
      problem:
        description: Engineering problem to discuss
        required: true
        type: string
      sources:
        description: HTTPS URLs or repository-relative .md/.txt paths, one per line
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: podcast-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Generate, render, upload and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ secrets.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ secrets.ELEVENLABS_VOICE_B }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          EPISODE_SLUG: ${{ inputs.slug }}
          EPISODE_PROBLEM: ${{ inputs.problem }}
          EPISODE_SOURCES: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          args=(--slug "$EPISODE_SLUG" --problem "$EPISODE_PROBLEM" --approve)
          while IFS= read -r source; do
            [[ -z "$source" ]] || args+=(--source "$source")
          done <<< "$EPISODE_SOURCES"
          sd-podcast run "${args[@]}"
      - name: Commit episode metadata and site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add episodes docs
          git diff --cached --quiet || git commit -m "Publish episode ${{ inputs.slug }}"
          git push

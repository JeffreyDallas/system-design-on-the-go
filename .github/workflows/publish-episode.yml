name: Manually produce an approved episode

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Existing reviewed episode slug
        required: true
        type: string
      dry_run:
        description: Validate the episode and print the plan without paid calls or commits
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: publish-episode-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish episode
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit episode metadata and generated site files.
    environment: workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Dry-run plan
        if: inputs.dry_run
        env:
          EPISODE_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          [[ "$EPISODE_SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid slug: $EPISODE_SLUG" >&2; exit 1; }
          test -f "episodes/${EPISODE_SLUG}/episode.json"
          jq '{slug, title, approved_script_hash, audio_url}' "episodes/${EPISODE_SLUG}/episode.json"
          echo "Would render approved audio, upload it to R2, rebuild Pages/RSS, and commit metadata."
      - name: Render, upload and publish
        if: '!inputs.dry_run'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ secrets.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ secrets.ELEVENLABS_VOICE_B }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          GOOGLE_CLOUD_AUDIO_API_KEY: ${{ secrets.GOOGLE_CLOUD_AUDIO_API_KEY }}
          GOOGLE_TTS_LANGUAGE_CODE: ${{ vars.GOOGLE_TTS_LANGUAGE_CODE }}
          GOOGLE_VOICE_A: ${{ vars.GOOGLE_VOICE_A }}
          GOOGLE_VOICE_B: ${{ vars.GOOGLE_VOICE_B }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          EPISODE_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          [[ "$EPISODE_SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "Invalid slug: $EPISODE_SLUG" >&2; exit 1; }
          sd-podcast run --slug "$EPISODE_SLUG" --approve
      - name: Commit episode metadata and site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add episodes docs
          git diff --cached --quiet || git commit -m "Publish generated episode"
          git push

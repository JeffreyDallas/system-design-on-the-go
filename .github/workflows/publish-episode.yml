name: Generate and publish a new podcast episode

on:
  workflow_dispatch:
    inputs:
      sources:
        description: HTTPS URLs or repository-relative .md/.txt paths, one per line
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-episode-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish episode
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit episode metadata and generated site files.
    environment: podcast-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Generate, render, upload and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_A: ${{ secrets.ELEVENLABS_VOICE_A }}
          ELEVENLABS_VOICE_B: ${{ secrets.ELEVENLABS_VOICE_B }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          GOOGLE_CLOUD_AUDIO_API_KEY: ${{ secrets.GOOGLE_CLOUD_AUDIO_API_KEY }}
          GOOGLE_TTS_LANGUAGE_CODE: ${{ vars.GOOGLE_TTS_LANGUAGE_CODE }}
          GOOGLE_VOICE_A: ${{ vars.GOOGLE_VOICE_A }}
          GOOGLE_VOICE_B: ${{ vars.GOOGLE_VOICE_B }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          EPISODE_SOURCES: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          args=(--approve)
          while IFS= read -r source; do
            [[ -z "$source" ]] || args+=(--source "$source")
          done <<< "$EPISODE_SOURCES"
          sd-podcast run "${args[@]}"
      - name: Commit episode metadata and site
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add episodes docs
          git diff --cached --quiet || git commit -m "Publish generated episode"
          git push

name: Generate episode draft PR

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Episode proposal issue number
        required: true
        type: string
      dry_run:
        description: Validate and print the plan without calling model APIs or opening a PR
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: episode-draft-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'episode/accepted' &&
      github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    environment: workflow
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - id: read-proposal
        name: Read proposal
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" --json body,title,author > proposal.json
          python -m podcast_pipeline.proposals --body-file <(jq -r .body proposal.json) > proposal-fields.json
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Dry-run plan
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run: proposal is valid."
          jq . proposal-fields.json
          echo "Would generate a reviewed episode draft and open a draft PR."
      - name: Generate reviewed draft
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRIPT_MODEL: ${{ vars.SCRIPT_MODEL }}
        run: |
          set -euo pipefail
          mapfile -t sources < <(jq -r '.sources[]' proposal-fields.json)
          args=(new)
          for source in "${sources[@]}"; do args+=(--source "$source"); done
          sd-podcast "${args[@]}" | tee generation.log
          slug=$(git status --short | sed -n 's#^?? episodes/\([^/]\+\)/.*#\1#p' | head -1)
          test -n "$slug"
          echo "slug=$slug" >> "$GITHUB_ENV"
      - name: Open draft PR
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.read-proposal.outputs.issue_number }}
        run: |
          set -euo pipefail
          branch="episode-draft/${ISSUE_NUMBER}-${slug}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add episodes
          git commit -m "Draft episode from proposal #${ISSUE_NUMBER}"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          pr_url=$(gh pr create --draft --base main --head "$branch" \
            --title "Draft episode: $(jq -r .topic proposal-fields.json)" \
            --body "Generated from #${ISSUE_NUMBER}. Review episode.json and design-brief.json before adding episode/production-approved.")
          gh issue comment "$ISSUE_NUMBER" --body "Generated draft PR: $pr_url. A maintainer must review the script before production."
